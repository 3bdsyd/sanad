name: sanad
description: 'سند — سندك للخطوة الجاية'
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  lottie: ^3.5.1
  firebase_core: ^4.15.0
  flutter_multi_formatter: ^2.13.11
  share_plus: ^13.3.0
dev_dependencies:
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
