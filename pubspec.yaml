name: snad
description: 'سند — فرص العمل والتواصل المهني'
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  lottie: ^3.5.1
  # Keep FlutterFire aligned on Firebase Apple SDK 12.19.3 (SPM exact pins).
  firebase_core: 4.15.2
  flutter_multi_formatter: ^2.13.11
  share_plus: ^13.3.0
  app_links: ^7.2.1
  web: ^1.1.1
  package_info_plus: ^10.2.2
  firebase_messaging: 16.7.1
  flutter_local_notifications: ^22.3.1
  # Native HTTP/2/3 transports, preserving the existing package:http API.
  cupertino_http: ^3.1.0
  cronet_http: ^1.10.1
  google_mobile_ads: ^9.2.0
  firebase_auth: 6.7.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  in_app_review: ^2.0.12
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
    - assets/animations/
    - assets/images/
    - assets/images/flags/
  fonts:
    # CanvasKit otherwise downloads its default fallback before starting the app.
    # The interface continues to use Vazirmatn; this fallback ships with its license.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
