<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#20508A">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="فرص عمل في سوريا. تصفح بلا حساب وتواصل مباشرة مع المعلن.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="سند">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>سند | سندك للخطوة الجاية</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #F2F7FC; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0D1523; }
      #sanad-launch { background: #0D1523; }
    }
    #sanad-launch {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #F2F7FC; pointer-events: none; z-index: 1;
    }
    #sanad-launch img { width: 96px; height: 96px; border-radius: 24px; }
  </style>
</head>
<body>
  <div id="sanad-launch" aria-hidden="true">
    <img src="icons/Icon-192.png" width="96" height="96" alt="">
  </div>
  <script>
    // Flutter dispatches this event after presenting its first rasterized frame.
    // Its initial logo has the same dimensions and position as this mark.
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('sanad-launch')?.remove();
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
